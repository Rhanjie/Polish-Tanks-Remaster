# Reusable: runs all EditMode and PlayMode tests. Called by the other workflows.
name: Tests

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to test (empty = the ref that triggered the caller)
        type: string
        default: ''

jobs:
  tests:
    name: Unity tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          lfs: true

      - uses: actions/cache@v6
        with:
          path: Library
          key: Library-tests-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}-${{ hashFiles('Assets/**') }}
          restore-keys: |
            Library-tests-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}-
            Library-tests-

      - uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: all
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity test results

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: ${{ steps.tests.outputs.artifactsPath }}
          if-no-files-found: warn
