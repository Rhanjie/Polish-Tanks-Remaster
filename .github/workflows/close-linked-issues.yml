# GitHub closes issues named with "Closes #N" only when a PR merges into the default branch (master).
# Work is done once it reaches development, so close them here; the project board then moves them to Done.
name: Close linked issues

on:
  pull_request:
    types: [closed]
    branches: [development]

permissions:
  issues: write

jobs:
  close:
    name: Close linked issues
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Close issues named in the PR description
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BODY: ${{ github.event.pull_request.body }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          numbers=$(printf '%s' "$BODY" | grep -oiE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]*:?[[:space:]]+#[0-9]+' | grep -oE '[0-9]+$' | sort -un || true)
          if [ -z "$numbers" ]; then
            echo "No linked issues in the description of #$PR."
            exit 0
          fi
          for number in $numbers; do
            state=$(gh issue view "$number" --json state --jq .state 2>/dev/null || echo MISSING)
            if [ "$state" = "OPEN" ]; then
              gh issue close "$number" --reason completed --comment "Merged into development in #$PR."
            else
              echo "#$number is $state, skipping."
            fi
          done
