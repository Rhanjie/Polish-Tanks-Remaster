# Reusable: builds the Windows and web (itch.io) players and uploads each as a zipped artifact.
name: Build

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build (empty = the ref that triggered the caller)
        type: string
        default: ''
      version:
        description: Version written into Player Settings for this build
        type: string
        required: true
      artifact-prefix:
        description: Start of the artifact and zip names; the platform (-win64, -web) is appended
        type: string
        required: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            platform: StandaloneWindows64
            suffix: win64
          - name: Web
            platform: WebGL
            suffix: web
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          lfs: true

      - uses: actions/cache@v6
        with:
          path: Library
          key: Library-${{ matrix.platform }}-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}-${{ hashFiles('Assets/**') }}
          restore-keys: |
            Library-${{ matrix.platform }}-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}-
            Library-${{ matrix.platform }}-

      - uses: game-ci/unity-builder@v6
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ matrix.platform }}
          buildName: PolishTanksRemaster
          versioning: Custom
          version: ${{ inputs.version }}

      # itch.io needs index.html at the root of the web zip, so zip the folder that holds it.
      - name: Zip build
        run: |
          if [ "${{ matrix.platform }}" = "WebGL" ]; then
            dir=$(dirname "$(find build/WebGL -name index.html -print -quit)")
          else
            dir=build/${{ matrix.platform }}
          fi
          cd "$dir"
          zip -qr "$GITHUB_WORKSPACE/${{ inputs.artifact-prefix }}-${{ matrix.suffix }}.zip" .

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-prefix }}-${{ matrix.suffix }}
          path: ${{ inputs.artifact-prefix }}-${{ matrix.suffix }}.zip
          if-no-files-found: error
