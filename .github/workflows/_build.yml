# Reusable: builds the Windows and web (itch.io) players and uploads each as a zipped artifact.
name: Build

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build (empty = the ref that triggered the caller)
        type: string
        default: ''
      version:
        description: Version written into Player Settings for this build
        type: string
        required: true
      artifact-prefix:
        description: Start of the artifact and zip names; the platform (-win64, -web) is appended
        type: string
        required: true
      platforms:
        description: JSON list of players to build, from "win64" and "web"
        type: string
        default: '["win64", "web"]'

jobs:
  build:
    name: Build ${{ matrix.suffix == 'web' && 'Web' || 'Windows' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        suffix: ${{ fromJSON(inputs.platforms) }}
    env:
      PLATFORM: ${{ matrix.suffix == 'web' && 'WebGL' || 'StandaloneWindows64' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          lfs: true

      - uses: actions/cache@v6
        with:
          path: Library
          key: Library-${{ env.PLATFORM }}-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}-${{ hashFiles('Assets/**') }}
          restore-keys: |
            Library-${{ env.PLATFORM }}-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}-
            Library-${{ env.PLATFORM }}-

      - uses: game-ci/unity-builder@v6
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ env.PLATFORM }}
          buildName: PolishTanksRemaster
          versioning: Custom
          version: ${{ inputs.version }}

      # itch.io needs index.html at the root of the web zip, so zip the folder that holds it.
      - name: Zip build
        run: |
          if [ "${{ env.PLATFORM }}" = "WebGL" ]; then
            index=$(find build/WebGL -name index.html -print -quit)
            if [ -z "$index" ]; then
              echo "::error::No index.html in build/WebGL, the web build is incomplete."
              exit 1
            fi
            dir=$(dirname "$index")
          else
            dir=build/${{ env.PLATFORM }}
          fi
          cd "$dir"
          zip -qr "$GITHUB_WORKSPACE/${{ inputs.artifact-prefix }}-${{ matrix.suffix }}.zip" .

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-prefix }}-${{ matrix.suffix }}
          path: ${{ inputs.artifact-prefix }}-${{ matrix.suffix }}.zip
          if-no-files-found: error
