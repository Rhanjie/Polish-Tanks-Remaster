# Push to master (merged release PR): tests, Windows and web builds, tag vX.Y.Z, a GitHub Release and the vX.Y.Z milestone closed.
name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  checks: write

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: version
        run: |
          version=$(bash .github/scripts/project-version.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::notice::v$version is already released, nothing to do. Bump bundleVersion to release again."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  tests:
    name: Tests
    needs: version
    if: needs.version.outputs.release == 'true'
    uses: ./.github/workflows/_tests.yml
    secrets: inherit

  build:
    name: Build
    needs: [version, tests]
    uses: ./.github/workflows/_build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      artifact-prefix: PolishTanksRemaster-${{ needs.version.outputs.version }}
    secrets: inherit

  publish:
    name: Publish release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: PolishTanksRemaster-${{ needs.version.outputs.version }}-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Polish Tanks Remaster v${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: PolishTanksRemaster-${{ needs.version.outputs.version }}-*.zip
      - name: Close the version milestone
        env:
          GH_TOKEN: ${{ github.token }}
          MILESTONE: v${{ needs.version.outputs.version }}
        run: |
          number=$(gh api "repos/${{ github.repository }}/milestones?state=open&per_page=100" --jq ".[] | select(.title == \"$MILESTONE\") | .number")
          if [ -z "$number" ]; then
            echo "::notice::No open milestone $MILESTONE, nothing to close."
            exit 0
          fi
          gh api -X PATCH "repos/${{ github.repository }}/milestones/$number" -f state=closed > /dev/null
          echo "Closed milestone $MILESTONE"
